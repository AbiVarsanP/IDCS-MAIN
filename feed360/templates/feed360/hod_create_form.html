{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2>Create Feedback Form</h2>
    <form method="post">
        {% csrf_token %}
        <div class="card mb-3">
            <div class="card-body">
                {{ form.as_p }}
            </div>
        </div>
        <h4>Questions</h4>
        <div id="questions">
            {{ formset.management_form }}
            {% for form in formset %}
                <div class="card mb-2">
                    <div class="card-body">
                        {{ form.as_p }}
                        {% if form.instance.pk %}
                            <input type="checkbox" name="{{ form.prefix }}-DELETE"> Delete
                        {% endif %}
                    </div>
                </div>
            {% endfor %}
        </div>
        <button type="submit" class="btn btn-primary">Create Form</button>
    </form>
    <hr>
    <!-- JS enhancement: Add/Remove question rows dynamically -->
    <!-- For now, one empty question row is rendered. -->
</div>
{% endblock %}
