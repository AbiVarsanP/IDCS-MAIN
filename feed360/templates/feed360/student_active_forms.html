{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="page-header float-center">
    <center>
    <h3 style="background:#1976d2;color:#fff;padding:10px 24px;border-radius:6px;display:inline-block;box-shadow:0 2px 8px rgba(25,118,210,0.08);">Active Feedback Forms</h3>
    </center>
    {% if forms %}
        <ul class="list-group mb-4">
            {% for form in forms %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>{{ form.title }} </span>
                    <a href="{% url 'feed360_fill' form.id %}" class="btn btn-primary btn-sm">Fill Feedback</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <div class="alert alert-info">No active feedback forms for your class.</div>
    {% endif %}
</div>
{% endblock %}
