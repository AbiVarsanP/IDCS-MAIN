{% extends 'base.html' %}
{% block root %}
<!-- Bonafide Table -->
<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <strong class="card-title">Bonafide Status</strong>

            </div>
            <div class="table-stats order-table ov-h">
                <table class="table ">
                    <thead>
                        <tr>
                            <th class="serial">#</th>
                            <th>ID</th>
                            <th>TITLE</th>
                            <th>MENTOR</th>
                            <th>ADVISOR</th>
                            <th>HOD</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if bonafides %}
                        {% for i in bonafides %}
                        <tr>
                            <td class="serial">{{ forloop.counter }}.</td>
                            <td> #BF{{i.id}} </td>
                            <td> <span class="name">{{i.sub}}</span> </td>
                            <td>
                                <span class="badge badge-{{i.Mstatus}}">{{i.Mstatus}}</span>
                            </td>
                            <td>
                                <span class="badge badge-{{i.Astatus}}">{{i.Astatus}}</span>
                            </td>
                            <td>
                                <span class="badge badge-{{i.Hstatus}}">{{i.Hstatus}}</span>
                            </td>
                        </tr>
                        {% endfor %}
                        {% else %}
                        <tr><td colspan="6">No Bonafide records found</td></tr>
                        {% endif %}
                    </tbody>
                </table>
            </div> <!-- /.table-stats -->
        </div>
    </div>
</div>
{% endblock %}
