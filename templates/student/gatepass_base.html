{% extends 'base.html' %}



{% block root %}
<div class="row mb-4">
    <div class="col-md-6">
        <a href="{% url 'gatepass' %}?action=apply" class="btn btn-primary btn-block">Apply for Gatepass</a>
    </div>
    <div class="col-md-6">
        <a href="{% url 'gatepass' %}?action=status" class="btn btn-info btn-block">View Gatepass Status</a>
    </div>
</div>
<div id="gatepass-content">
    {% if action == 'apply' or not action %}
        {% include 'student/gatepass_apply.html' %}
    {% elif action == 'status' %}
        {% include 'student/gatepass_status.html' %}
    {% endif %}
</div>
{% endblock %}
