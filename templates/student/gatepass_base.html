{% extends 'base.html' %}

{% block root %}
<style>
    .gp-header-bar {
    padding: 12px 20px;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f8f9fa;
    border-bottom: 2px solid #e0e0e0;
}

.header-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: #333;
}

.home-icon i {
    font-size: 1.5rem;
    transition: transform 0.2s ease;
}

.home-icon:hover i {
    transform: scale(1.2);
}
</style>
<div class="gp-header-bar" >
    <h5 class="header-title mb-0">Gatepass </h5>
    <a href="{% url 'dash' %}" class="home-icon">
        <i class="fa fa-home"></i>
    </a>
</div>
<div class="animated fadeIn" style="margin-top: 16px;">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow-sm">
                <div class="card-header text-center" style="background:#1976d2; color:#fff; font-weight:700; font-size:1.2rem; border-radius:8px 8px 0 0; box-shadow:0 2px 8px rgba(25,118,210,0.08);">
                    Gatepass Application
                </div>
                <div class="card-body">
                    <div id="gatepass-content">
                        {% if action == 'apply' or not action %}
                            {% include 'student/gatepass_apply.html' %}
                        {% elif action == 'status' %}
                            {% include 'student/gatepass_status.html' %}
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
