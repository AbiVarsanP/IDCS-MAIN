{% extends 'base.html' %}
{% block root %}
<style>
    .card-header {
        background: #1976d2 !important;
        border-radius: 6px 6px 0 0 !important;
        box-shadow: 0 2px 8px rgba(25,118,210,0.08);
    }
</style>
<style>
    .table thead th {
        background: #fff !important;
        color: #222 !important;
        font-weight: 700;
        border-color: #1976d2 !important;
        letter-spacing: 0.5px;
        text-align: center;
    }
    table tr[tabindex] {
        outline: none;
        transition: background 0.2s, box-shadow 0.2s;
    }
    table tr[tabindex]:hover {
        background: #e3f2fd !important;
        outline: 2px solid #1976d2 !important;
        z-index: 2;
        position: relative;
    }
    table tr[tabindex]:hover * {
        filter: none !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        color: inherit !important;
    }
    tbody:has(tr[tabindex]:hover) tr[tabindex]:not(:hover) {
        filter: blur(2px) grayscale(0.2);
        opacity: 0.5;
        pointer-events: none;
        transition: filter 0.2s, opacity 0.2s;
    }
</style>

<div class="row">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <center>
                <strong class="card-title" style="background:#1976d2;color:#fff;padding:8px 20px;border-radius:6px;display:inline-block;box-shadow:0 2px 8px rgba(25,118,210,0.08);">Gatepass Status</strong>
            </center>
            </div>
            <div class="table-stats order-table ov-h">
                <table class="table ">
                    <thead>
                        <tr>
                            <th class="serial">#</th>
                            <th>ID</th>
                            <th>TITLE</th>
                            <th>MENTOR</th>
                            <th>ADVISOR</th>
                        
                            <th>HOD</th>

                        </tr>
                    </thead>
                    <tbody>
                        {% if gatepasses %}
                        {% for i in gatepasses %}
                        <tr tabindex="0">
                            <td class="serial">{{ forloop.counter }}.</td>
                            <td> #GP{{i.id}} </td>
                            <td> <span class="name">{{i.sub}}</span> </td>
                            <td>
                                <span class="badge badge-{{i.Mstatus}}">{{i.Mstatus}}</span>
                            </td>
                            <td>
                                <span class="badge badge-{{i.Astatus}}">{{i.Astatus}}</span>
                            </td>
                            <td>
                                <span class="badge badge-{{i.Hstatus}}">{{i.Hstatus}}</span>
                            </td>
                        </tr>
                        {% endfor %}
                        {% else %}
                        <tr><td colspan="6">No Gatepass records found</td></tr>
                        {% endif %}

                    </tbody>
                </table>
            </div> <!-- /.table-stats -->
        </div>
    </div>
</div>
{% endblock %}
